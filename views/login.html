<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-black flex flex-col min-h-screen">
    <!-- Navigation Bar -->
    <nav
      class="sticky top-0 z-50 bg-[#05070a]/90 backdrop-blur-md border-b border-white/5 px-8 py-4 flex items-center justify-between w-full"
    >
      <div class="flex items-center gap-10">
        <a
          href="main.html"
          class="text-2xl font-extrabold italic tracking-tighter text-white hover:opacity-80 transition-opacity"
        >
          KASET-<span class="text-cyan-400">NEWS</span>
        </a>
      </div>

      <div
        class="flex items-center gap-6 text-[10px] font-bold uppercase tracking-[0.2em]"
      >
        <a
          href="main.html"
          class="text-slate-500 hover:text-white transition-colors"
        >
          Dashboard
        </a>

        <a href="#" class="text-cyan-400 border-b-2 border-cyan-400 pb-1">
          About Us
        </a>

        <a href="#" class="text-slate-500 hover:text-white transition-colors">
          Login
        </a>
        <li class="w-[1px] h-9 bg-gray-500"></li>
        <button
          class="bg-cyan-500 text-black px-4 py-2 rounded-sm ml-4 shadow-[0_0_15px_rgba(6,182,212,0.3)] font-bold"
        >
          Register
        </button>
      </div>
    </nav>
    <!-- End Navigation -->

    <!-- Login Form -->
    <div class="flex flex-1 items-center justify-center">
      <div class="w-[520px] border border-slate-800 p-10 bg-[#030b18]">
        <h1 class="text-4xl font-extrabold tracking-tight">
          <span class="text-white">KASET-</span>
          <span class="text-cyan-400">NEWS</span>
        </h1>
        <p class="text-xs tracking-[0.35em] text-slate-500 mt-3 uppercase">
          // Sign in to your account
        </p>
        <!-- Form -->
        <form class="mt-10 space-y-8">
          <div>
            <label
              class="block text-xs tracking-[0.3em] text-slate-500 mb-3 uppercase"
            >
              Email Address
            </label>
            <input
              type="email"
              placeholder="you@kasetnews.com"
              class="w-full bg-transparent border border-slate-700 px-4 py-3 text-sm text-slate-300 outline-none focus:border-cyan-400 transition"
            />
          </div>
          <div>
            <label
              class="block text-xs tracking-[0.3em] text-slate-500 mb-3 uppercase"
            >
              Password
            </label>

            <input
              type="password"
              placeholder=". . . . . . ."
              class="w-full bg-transparent border border-slate-700 px-4 py-3 text-sm text-slate-300 outline-none focus:border-cyan-400 transition"
            />
          </div>

          <button
            class="w-full bg-cyan-500 text-black font-bold tracking-[0.3em] py-4 hover:bg-cyan-400 transition"
          >
            SIGN IN →
          </button>
        </form>

        <div
          class="border-t border-slate-800 mt-10 pt-6 text-center text-xs tracking-[0.25em] text-slate-500 uppercase"
        >
          No account?
          <span class="text-cyan-400 cursor-pointer hover:underline">
            Register here
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
